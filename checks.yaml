# What `curatrix check robarm-integration` runs (format: xdmod/curatrix/README.md, "checks.yaml").
version: 1
area: robarm-integration

docs:                                   # CK-A6 strict docs build (own docs + every upstream doc)
  registry: docs/documents.yaml

ids:                                    # CK-C1, CK-C2
  ledger: ids.yaml
  exclude: ["*.md", "claude/**", ".github/**"]

# System and integration test runs (Twister, HIL) are added as `commands` once the first test
# case exists. HIL run records live on the orphan branch `evidence` (D73), created by a later task.

# CK-H6: exactly the checks this repo runs (built-in and commands). A section that goes
# missing turns an expected check off, and CK-H6 fails.
expect: [
  CK-A1, CK-A3, CK-A4, CK-A5, CK-A6, CK-B1, CK-B2, CK-B3, CK-B5, CK-B6, CK-C1, CK-C2, CK-G1,
  CK-G2, CK-H1, CK-H2, CK-H3, CK-H4, CK-H6, CK-H7
]
